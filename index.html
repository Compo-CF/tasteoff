<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b5361f" />
    <title>tasteoff — food-competition judging</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
    <!-- QR generator (local, cached offline). Exposes global `qrcode`. -->
    <script src="vendor/qrcode.js"></script>
    <!-- Spreadsheet parser for event import. Exposes global `XLSX`. -->
    <script src="vendor/xlsx.full.min.js"></script>
    <!-- PDF generator for the client-facing results report. Exposes global `jspdf`. -->
    <script src="vendor/jspdf.umd.min.js"></script>

  <body>
    <div id="app" class="loading">Loading…</div>
    <script type="module" src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {})
        );
      }
    </script>
  </body>
</html>
